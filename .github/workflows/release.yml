name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT: HoverDrop.App/HoverDrop.App.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Версия из тега
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained)
        shell: pwsh
        run: >
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Скачать ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish\ffmpeg.exe

      - name: Установить vpk (версия как у пакета Velopack в проекте)
        shell: pwsh
        run: |
          $proj = [xml](Get-Content $env:PROJECT)
          $ref = $proj.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Velopack' }
          dotnet tool install -g vpk --version $ref.Version

      - name: Скачать прошлые релизы (для дельта-обновлений)
        shell: pwsh
        continue-on-error: true   # у самого первого релиза скачивать нечего
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Упаковать
        shell: pwsh
        run: >
          vpk pack --packId HoverDrop --packTitle HoverDrop --packAuthors TimofeyDanilyuk
          --packVersion ${{ steps.ver.outputs.version }} --packDir publish --mainExe HoverDrop.App.exe
          --icon HoverDrop.App/Assets/HoverDrop.ico --splashImage installer/splash.png

      - name: Выложить в GitHub Releases
        shell: pwsh
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --publish --releaseName "HoverDrop ${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }} --token ${{ secrets.GITHUB_TOKEN }}