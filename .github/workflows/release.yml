name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT: HoverDrop/HoverDrop.App/HoverDrop.App.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Версия из тега
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained)
        shell: pwsh
        run: >
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Скачать ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $exe = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish\ffmpeg.exe

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\HoverDrop.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "dist\HoverDrop-portable-${{ steps.ver.outputs.version }}.zip"

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true